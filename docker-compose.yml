services:
  mysql:
    image: mysql:8.0
    container_name: rokid-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: Admin123
      MYSQL_DATABASE: gdjl
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - rokid-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pAdmin123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # 依赖（ffmpeg + Python 包）已烘进镜像，容器重建不再从零重装
    build: ./cloud-backend
    image: rokid-backend:local
    container_name: rokid-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "6081:8000"
    volumes:
      - ./cloud-backend:/app
    environment:
      # ============ 数据库配置 ============
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Admin123
      DATABASE_URL: mysql+aiomysql://root:Admin123@mysql:3306/gdjl?charset=utf8mb4

      # ============ 阿里云百炼 DashScope 配置 ============
      # 基础 LLM 配置
      LLM_PROVIDER: "dashscope"
      DASHSCOPE_API_KEY: "sk-sp-H.DXLMDD.sYc6.MEQCIBqHw9M0SGRx8YfdKmUrblymdCiaB32yQb8ilRU2Dd0jAiAtVA42P-XA26-8cjwHi96_diqAqHtbK9snjMZjOZ8F9Q"
      DASHSCOPE_BASE_URL: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      DEFAULT_LLM_MODEL: "qwen3.7-plus"

      # 语音识别 (STT) - 使用阿里云百炼实时语音识别
      STT_PROVIDER: "dashscope"
      DEFAULT_STT_PROVIDER: "阿里云百炼"
      DEFAULT_STT_API_KEY: "sk-sp-H.DXLMDD.sYc6.MEQCIBqHw9M0SGRx8YfdKmUrblymdCiaB32yQb8ilRU2Dd0jAiAtVA42P-XA26-8cjwHi96_diqAqHtbK9snjMZjOZ8F9Q"
      DEFAULT_STT_BASE_URL: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      DEFAULT_STT_MODEL_ID: "qwen-audio-3.0-asr-flash"

      # 语音合成 (TTS)
      TTS_PROVIDER: "dashscope"
      DEFAULT_TTS_PROVIDER: "阿里云百炼"
      DEFAULT_TTS_API_KEY: "sk-sp-H.DXLMDD.sYc6.MEQCIBqHw9M0SGRx8YfdKmUrblymdCiaB32yQb8ilRU2Dd0jAiAtVA42P-XA26-8cjwHi96_diqAqHtbK9snjMZjOZ8F9Q"
      DEFAULT_TTS_BASE_URL: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      DEFAULT_TTS_MODEL_ID: "qwen-audio-3.0-tts-plus"
      DEFAULT_TTS_VOICE: "longanlingxi"

      # 大语言模型 (LLM) - 备选文本模型
      DEFAULT_LLM_API_KEY: "sk-sp-H.DXLMDD.sYc6.MEQCIBqHw9M0SGRx8YfdKmUrblymdCiaB32yQb8ilRU2Dd0jAiAtVA42P-XA26-8cjwHi96_diqAqHtbK9snjMZjOZ8F9Q"
      DEFAULT_LLM_BASE_URL: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      DEFAULT_LLM_MODEL_ID: "qwen3.7-plus"

      # 视觉识别 (VLM) - AI Center 华工隐患识别，令牌见 模型调用文档/华工隐患识别大模型调用key.txt
      AI_CENTER_TOKEN: "sat_6c28539d-ad06-4a0f-ad1b-71dc13f189ac.t-y4ETggBhMrpMKlHTarGhE-w4MzzxvX"
      AI_CENTER_ORG_ID: "65312e3f-7f62-4595-a82c-31d0acde616b"
      AI_CENTER_ENVIRONMENT: "test"
      HUAGONG_VLM_TOKEN: "sat_6c28539d-ad06-4a0f-ad1b-71dc13f189ac.t-y4ETggBhMrpMKlHTarGhE-w4MzzxvX"
      DEFAULT_VLM_PROVIDER: "华工"
      DEFAULT_VLM_API_KEY: "sat_6c28539d-ad06-4a0f-ad1b-71dc13f189ac.t-y4ETggBhMrpMKlHTarGhE-w4MzzxvX"
      DEFAULT_VLM_BASE_URL: "https://ai.sentripy.cn/api/v1/tools/hazard_vlm_detection/invoke-upload"
      DEFAULT_VLM_MODEL_ID: "hazard_vlm_detection"
      VLM_INPUT_NAME: "image"

      # ============ 通用配置 ============
      ALLOW_PUBLIC_REGISTRATION: "true"
      PUBLIC_REGISTRATION_ROLES: "inspector,special_supervisor"
      STT_MOCK_MODE: "false"
      # 关闭火山引擎相关配置（保留但置空，避免冲突）
      VOLC_API_KEY: ""
      VOLC_BASE_URL: ""
      VOLC_MODEL: ""

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rokid-net

  web-admin:
    image: node:20-alpine
    container_name: rokid-web-admin
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web-admin:/app
    command: >
      sh -c "npm config set registry https://registry.npmmirror.com &&
             npm install &&
             npm run dev -- --host 0.0.0.0 --port 3000"
    networks:
      - rokid-net

  mobile-h5:
    image: node:20-alpine
    container_name: rokid-mobile-h5
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mobile-h5:/app
    ports:
    - "5174:5174"
    command: >
      sh -c "npm config set registry https://registry.npmmirror.com &&
             npm install &&
             npm run dev -- --host 0.0.0.0 --port 5174"
    networks:
      - rokid-net

  nginx:
    image: nginx:alpine
    container_name: rokid-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "10002:443"   # 验收/备用入口：容器 443 -> 本机 10002（4432 旧入口已删，标准入口走 80/443）
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web-admin/dist:/usr/share/nginx/html/admin
      - ./mobile-h5/dist:/usr/share/nginx/html/mobile
    depends_on:
      - backend
    networks:
      - rokid-net

networks:
  rokid-net:
    driver: bridge

volumes:
  mysql_data:
