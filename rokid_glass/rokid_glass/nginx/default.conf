map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name mybaize.com www.mybaize.com;

    client_max_body_size 100M;
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.api+json;
    gzip_comp_level 6;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # =========================
    # 后端 API
    # =========================
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================
    # 上传文件（图片/视频/语音/PDF）
    # 后端 main.py: app.mount("/uploads", StaticFiles(...))
    # =========================
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        expires 7d;
    }

    # =========================
    # 导出文件（文书 PDF/DOCX）
    # 后端 main.py: app.mount("/exports", StaticFiles(...))
    # =========================
    location /exports/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        expires 1d;
    }

    # =========================
    # 后端健康检查
    # =========================
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # =========================
    # FastAPI 文档
    # =========================
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $http_host;
    }

    # =========================
    # 管理后台旧入口 -> 规范化到根路径
    # Web 后台是 Vue SPA，history 路由挂在根路径（/login、/dashboard…），
    # /admin/ 没有对应路由（直接打开会白屏），故统一 301 回根路径。
    # =========================
    # 注意：必须用 $http_host（含端口），容器内监听的是标准端口 443，
    # 直接写 return 301 / 会生成不带外部端口(4432)的 URL 导致跳转失效。
    location /admin/ {
        return 301 $scheme://$http_host/;
    }

    # =========================
    # 管理后台 assets 静态资源
    # =========================
    location /assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # baize-logo.png
    # =========================
    location /baize-logo.png {
        alias /usr/share/nginx/html/admin/baize-logo.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # H5 移动端 - 静态文件（生产版本）
    # =========================
    location /mobile/ {
        alias /usr/share/nginx/html/mobile/;
        try_files $uri $uri/ /mobile/index.html;
        index index.html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # =========================
    # H5 移动端 assets 静态资源
    # =========================
    location /mobile/assets/ {
        alias /usr/share/nginx/html/mobile/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # 根路径 -> Web 管理后台（Vue SPA 兜底）
    # SPA 使用 history 路由且 base 为根路径，刷新或直连子路由
    # （/login、/dashboard、/users…）时统一交给 index.html 接管，避免 404。
    # 静态资源命中上方更精确的 location（/assets/、/uploads/ 等），不走这里。
    # =========================
    location / {
        root /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # SPA 入口不缓存，保证发版后立即生效（哈希资源仍由 /assets/ 长缓存）
    location = /index.html {
        root /usr/share/nginx/html/admin;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
